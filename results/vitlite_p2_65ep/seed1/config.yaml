run_name: vitlite_p2_65ep
model:
  name: vit_lite
  patch_size: 2
data:
  dir: data
  val_size: 0
  image_size: 32
  normalize: cifar
  crop_scale:
  - 0.8
  - 1.0
  randaugment_magnitude: 9
  num_workers: 4
train:
  epochs: 65
  batch_size: 128
  eval_batch_size: 512
  label_smoothing: 0.1
  mixup_alpha: 0.8
  cutmix_alpha: 1.0
  mix_off_epoch: 38
  eval_every: 5
  ckpt_every: 5
  clip_grad: null
optim:
  name: adamw
  lr: 0.000275
  weight_decay: 0.06
  warmup_epochs: 2
  cooldown_epochs: 2
  min_lr: 1.0e-05
