run_name: vitlite_convstem
model:
  name: vit_lite_convstem
data:
  dir: data
  val_size: 0
  image_size: 32
  normalize: cifar
  crop_scale:
  - 0.8
  - 1.0
  randaugment_magnitude: 9
  num_workers: 4
train:
  epochs: 300
  batch_size: 128
  eval_batch_size: 512
  label_smoothing: 0.1
  mixup_alpha: 0.8
  cutmix_alpha: 1.0
  mix_off_epoch: 175
  eval_every: 10
  ckpt_every: 25
  clip_grad: null
optim:
  name: adamw
  lr: 0.000275
  weight_decay: 0.06
  warmup_epochs: 10
  cooldown_epochs: 10
  min_lr: 1.0e-05
